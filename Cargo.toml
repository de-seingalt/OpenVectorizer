[workspace]
resolver = "3"
members = ["crates/core", "crates/eval", "crates/cli", "crates/wasm", "app/src-tauri"]
# The desktop shell needs WebKitGTK system libraries; keep it out of the default
# `cargo build/test` so the engine can be worked on without them.
default-members = ["crates/core", "crates/eval", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/de-seingalt/OpenVectorizer"
rust-version = "1.90"

[workspace.dependencies]
openvectorizer-core = { path = "crates/core" }
openvectorizer-eval = { path = "crates/eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
vtracer = { version = "0.6.5", default-features = false }
resvg = "0.50"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
# Must stay in lockstep with the wasm-bindgen-cli version used in scripts/ and CI.
wasm-bindgen = "=0.2.130"
serde-wasm-bindgen = "0.6"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.release.package.openvectorizer-wasm]
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2
