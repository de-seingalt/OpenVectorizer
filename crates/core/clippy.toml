# docs/ALGORITHME.md §14.4: the engine must give the same bits natively and in WebAssembly.
# The transcendental methods of `std` call the platform's maths library, whose last bit may
# differ; use `crate::num::math` instead. `sqrt` and the basic operations are exact IEEE and
# stay allowed. Tests may compare against `std` with `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
  { path = "f64::exp", reason = "use crate::num::math::exp" },
  { path = "f64::exp2", reason = "not deterministic across platforms" },
  { path = "f64::exp_m1", reason = "not deterministic across platforms" },
  { path = "f64::ln", reason = "use crate::num::math::ln" },
  { path = "f64::ln_1p", reason = "use crate::num::math::ln_1p" },
  { path = "f64::log", reason = "not deterministic across platforms" },
  { path = "f64::log2", reason = "not deterministic across platforms" },
  { path = "f64::log10", reason = "not deterministic across platforms" },
  { path = "f64::powf", reason = "use crate::num::math::pow" },
  { path = "f64::powi", reason = "use crate::num::sq / cube or a product" },
  { path = "f64::sin", reason = "use crate::num::math::sin" },
  { path = "f64::cos", reason = "use crate::num::math::cos" },
  { path = "f64::tan", reason = "use crate::num::math::tan" },
  { path = "f64::sin_cos", reason = "use crate::num::math::sin_cos" },
  { path = "f64::asin", reason = "use crate::num::math::asin" },
  { path = "f64::acos", reason = "use crate::num::math::acos" },
  { path = "f64::atan", reason = "use crate::num::math::atan" },
  { path = "f64::atan2", reason = "use crate::num::math::atan2" },
  { path = "f64::sinh", reason = "not deterministic across platforms" },
  { path = "f64::cosh", reason = "not deterministic across platforms" },
  { path = "f64::tanh", reason = "not deterministic across platforms" },
  { path = "f64::cbrt", reason = "use crate::num::math::cbrt" },
  { path = "f64::hypot", reason = "use crate::num::math::hypot" },
  { path = "f64::mul_add", reason = "fused multiply-add rounds differently from a * b + c" },
  { path = "f32::exp", reason = "use crate::num::math::exp" },
  { path = "f32::exp2", reason = "not deterministic across platforms" },
  { path = "f32::exp_m1", reason = "not deterministic across platforms" },
  { path = "f32::ln", reason = "use crate::num::math::ln" },
  { path = "f32::ln_1p", reason = "use crate::num::math::ln_1p" },
  { path = "f32::log", reason = "not deterministic across platforms" },
  { path = "f32::log2", reason = "not deterministic across platforms" },
  { path = "f32::log10", reason = "not deterministic across platforms" },
  { path = "f32::powf", reason = "use crate::num::math::pow" },
  { path = "f32::powi", reason = "use crate::num::sq / cube or a product" },
  { path = "f32::sin", reason = "use crate::num::math::sin" },
  { path = "f32::cos", reason = "use crate::num::math::cos" },
  { path = "f32::tan", reason = "use crate::num::math::tan" },
  { path = "f32::sin_cos", reason = "use crate::num::math::sin_cos" },
  { path = "f32::asin", reason = "use crate::num::math::asin" },
  { path = "f32::acos", reason = "use crate::num::math::acos" },
  { path = "f32::atan", reason = "use crate::num::math::atan" },
  { path = "f32::atan2", reason = "use crate::num::math::atan2" },
  { path = "f32::sinh", reason = "not deterministic across platforms" },
  { path = "f32::cosh", reason = "not deterministic across platforms" },
  { path = "f32::tanh", reason = "not deterministic across platforms" },
  { path = "f32::cbrt", reason = "use crate::num::math::cbrt" },
  { path = "f32::hypot", reason = "use crate::num::math::hypot" },
  { path = "f32::mul_add", reason = "fused multiply-add rounds differently from a * b + c" },
]
# Iteration order of std's HashMap/HashSet is random per process: never in the engine.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap or a sorted Vec" },
  { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet or a sorted Vec" },
]
