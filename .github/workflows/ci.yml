name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  engine:
    name: Engine (Rust + quality benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated TypeScript types are committed
        run: git diff --exit-code -- app/src/lib/engine/generated
      - name: Quality benchmark (no regression vs baseline)
        run: cargo run --release -p openvectorizer-cli -- eval testdata --baseline testdata/baseline.json --out target/eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: target/eval/
      - run: scripts/build-wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: app/src/lib/engine/pkg/

  web:
    name: Web app (types, lint, tests, e2e)
    needs: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      OV_SKIP_WASM: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: app/src/lib/engine/pkg/
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: app/test-results/

  desktop:
    name: Desktop shell compiles (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: mkdir -p app/dist
      - run: cargo clippy -p openvectorizer-desktop -- -D warnings
